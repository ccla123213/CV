<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Siêu Đơn Giản</title>
    <style>
        /* CSS giao diện */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .todo-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-text { cursor: pointer; flex: 1; }
        .completed { text-decoration: line-through; color: #888; }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="todo-container">
    <h2>Việc Cần Làm</h2>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Nhập việc cần làm...">
        <button onclick="addTask()">Thêm</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    // JavaScript xử lý logic tại chỗ
    function addTask() {
        let input = document.getElementById('taskInput');
        let taskText = input.value.trim();
        
        if (taskText === "") return; // Nếu trống thì không làm gì cả

        let ul = document.getElementById('taskList');
        let li = document.createElement('li');

        // Tạo nội dung cho dòng công việc
        li.innerHTML = `
            <span class="task-text" onclick="toggleTask(this)">${taskText}</span>
            <button class="delete-btn" onclick="deleteTask(this)">Xóa</button>
        `;

        ul.appendChild(li);
        input.value = ""; // Xóa chữ trong ô nhập sau khi thêm xong
    }

    // Bấm vào chữ để gạch ngang (hoàn thành) hoặc bỏ gạch
    function toggleTask(element) {
        element.classList.toggle('completed');
    }

    // Bấm nút xóa để gỡ bỏ công việc
    function deleteTask(element) {
        element.parentElement.remove();
    }

    // Nhấn Enter trong ô nhập cũng tự động thêm việc
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addTask();
        }
    });
</script>

</body>
</html>
